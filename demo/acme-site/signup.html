<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Join the Tandem beta</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main>
    <h1>Join the beta</h1>
    <form action="/thanks" method="get" aria-label="Beta signup">
      <label for="name">Name</label>
      <input id="name" name="name" autocomplete="name">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email">
      <button type="submit">Request invite</button>
    </form>
  </main>
</body>
</html>

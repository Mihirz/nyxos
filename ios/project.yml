name: nyxOS
options:
  bundleIdPrefix: com.nyxos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
targets:
  nyxOS:
    type: application
    platform: iOS
    sources:
      - path: nyxOS
      - path: Config/Secrets.plist
        optional: true
        buildPhase: resources
    preBuildScripts:
      - name: Generate secrets and bundle core
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          for d in "$HOME"/.nvm/versions/node/*/bin; do PATH="$d:$PATH"; done
          "${SRCROOT}/scripts/gen-secrets.sh"
          # Re-bundle the shared TypeScript core so the grammar tracks the desktop app.
          "${SRCROOT}/scripts/bundle-core.sh" || echo "warning: could not re-bundle nyxcore.js; using the committed copy"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nyxos.ios
        PRODUCT_NAME: nyxOS
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: nyxOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SWIFT_OBJC_BRIDGING_HEADER: nyxOS/nyxOS-Bridging-Header.h
  nyxOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [nyxOSUITests]
    dependencies:
      - target: nyxOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nyxos.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: nyxOS
schemes:
  nyxOS:
    build:
      targets:
        nyxOS: all
        nyxOSUITests: [test]
    test:
      targets: [nyxOSUITests]
